  var K='coi-reload-game';

<style>
:root{--sky:#BFE6FF;--sky2:#E3F4FF;--grass:#6CC28F;--soil:#4E9D6E;--ink:#23314F;--cons:#4D96FF;--vow:#FFB627;--pink:#FF5C7A;--star:#FFC93C;--rock:#9AA6C4;--mascot:#2BB3A3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font:800 20px/1.3 "Arial Rounded MT Bold","Nunito","Noto Sans Thai",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:fixed;inset:0;background:linear-gradient(var(--sky) 0 72%,var(--grass) 72% 76%,var(--soil) 76%)}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px 120px}
.scr.on{display:flex}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--ink);outline-offset:4px}
/* ปุ่มใหญ่ ≥ 64px */
.big{min-width:96px;min-height:96px;border-radius:999px;background:var(--pink);color:#fff;font-size:34px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 34px;box-shadow:0 8px 0 #c93b55}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #c93b55}
.round{width:88px;height:88px;border-radius:50%;background:#fff;box-shadow:0 6px 0 #9fc4dc;display:inline-grid;place-items:center}
.round:active{transform:translateY(4px);box-shadow:0 2px 0 #9fc4dc}
.row{display:flex;gap:22px;align-items:center;justify-content:center}
.ico{width:46px;height:46px}
/* บล็อกตัวอักษร (ไม่มีหน้า) */
.blk{--c:var(--cons);position:relative;width:var(--s,120px);height:var(--s,120px);border-radius:18%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:calc(var(--s,120px)*.46);letter-spacing:-.02em;
  box-shadow:inset 0 calc(var(--s,120px)*.09) 0 rgba(255,255,255,.35),inset 0 calc(var(--s,120px)*-.1) 0 rgba(0,0,0,.18),0 calc(var(--s,120px)*.06) 0 rgba(35,49,79,.25)}
.blk.v{--c:var(--vow);color:var(--ink)}
/* แผนที่ */
#path{position:relative;width:min(360px,100%);height:min(440px,58vh)}
#path .stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
#path .stop.lock .blk{filter:grayscale(1) brightness(1.15);opacity:.55}
#path .stop.next .blk{animation:bob 1.2s ease-in-out infinite}
#path svg.trail{position:absolute;inset:0;width:100%;height:100%}
.lock-i{position:absolute;right:-8px;top:-8px;width:34px;height:34px}
.stars{display:flex;gap:2px;height:26px}
.stars svg{width:26px;height:26px}
@keyframes bob{50%{transform:translateY(-8px)}}
/* มาสคอต */
#mascot{position:fixed;left:12px;bottom:14px;width:96px;height:96px;z-index:5;pointer-events:none}
#mascot.talk .mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(2.2)}}
/* ปุ่มผู้ปกครอง: เล็ก มุมขวาบน ต้องกดค้าง */
#parent{position:fixed;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);z-index:6;display:grid;place-items:center}
#parent .ring{position:absolute;inset:0;border-radius:50%;border:4px solid var(--ink);clip-path:inset(0 100% 0 0);transition:none}
#parent.hold .ring{clip-path:inset(0 0 0 0);transition:clip-path 2s linear}
#panel{position:fixed;inset:0;background:rgba(35,49,79,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#panel.on{display:flex}
#panel .box{background:#fff;border-radius:20px;padding:18px;width:min(460px,100%);max-height:86vh;overflow:auto;font:500 15px/1.5 system-ui,"Noto Sans Thai",sans-serif}
#panel h2{font-size:18px;margin:0 0 8px}
#panel table{width:100%;border-collapse:collapse;font-size:13px}
#panel td{border-top:1px solid #e3e6ef;padding:3px 4px}
#panel .pb{background:#eef0ff;border-radius:12px;padding:10px 14px;margin:8px 8px 0 0;font-weight:700}
/* สัตว์ */
.ani{width:min(250px,62vw);height:min(250px,62vw);position:relative;display:grid;place-items:center}
.ani svg{width:100%;height:100%}
.ani .hold{position:absolute;right:2%;bottom:4%}
#s-intro.on .ani{animation:runin .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes runin{from{transform:translateX(110vw)}}
#s-pass.on .ani{animation:joy .5s ease-in-out 3 alternate}
@keyframes joy{to{transform:translateY(-22px) rotate(-4deg)}}
/* วงคลื่นกำลังฟัง */
#wave,.wave{position:relative;width:200px;height:200px;display:grid;place-items:center}
#wave i,.wave i{position:absolute;inset:0;border-radius:50%;border:6px solid var(--mascot);opacity:0;transform:scale(calc(.62 + var(--lv,0)*.5))}
#wave.on i,.wave.on i{opacity:.8;animation:ripple 1.4s ease-out infinite}
.wave.on i:nth-child(2){animation-delay:.45s}.wave.on i:nth-child(3){animation-delay:.9s}
@keyframes ripple{from{transform:scale(.62);opacity:.9}to{transform:scale(calc(1.05 + var(--lv,0)*.6));opacity:0}}
#wave .mic,.wave .mic{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 #9fc4dc}
.wave:not(.on) .mic{opacity:.45}
/* คำ */
#wordTxt{font-size:64px;letter-spacing:.02em;color:var(--ink);background:#fff;border-radius:22px;padding:4px 24px;box-shadow:0 6px 0 #9fc4dc}
#wordTxt .first{color:var(--cons)}
#wordTxt .first.v{color:var(--vow)}
/* ผ่านด่าน */
#bigStars{display:flex;gap:10px}
#bigStars svg{width:72px;height:72px}
#bigStars .on{animation:pop .4s cubic-bezier(.2,.9,.3,1.4) both}
#bigStars .on:nth-child(2){animation-delay:.25s}#bigStars .on:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(0)}}
#sticker{width:96px;height:96px;border-radius:50%;background:#fff;border:6px dashed var(--pink);display:grid;place-items:center;overflow:hidden}
#sticker svg{width:80px;height:80px}
.loadring{width:120px;height:120px}
.cross{position:relative}
.cross::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:8px;background:var(--pink);border-radius:4px;transform:rotate(-40deg)}
#micHelp{max-width:420px;font:600 15px/1.55 system-ui,"Noto Sans Thai",sans-serif;background:#fff;border-radius:16px;padding:12px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="world"></div>

    <button class="big" id="retry" aria-label="ลองใหม่"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" d="M6 11a6 6 0 0012 0M12 17v4"/></svg></button>
  </div>
</section>

<section class="scr" id="s-word" aria-label="พูดคำ">
  <div class="ani" id="wordAni"></div>
  <div id="wordTxt"></div>
  <div id="waveW" class="wave"><i></i><i></i><i></i><div class="mic"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="var(--ink)"/><path fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" d="M6 11a6 6 0 0012 0M12 17v4"/></svg></div></div>
</section>

<section class="scr" id="s-pass" aria-label="ผ่านด่าน">
  <div id="bigStars"></div>
  <div class="ani" id="passAni"></div>
  <div id="sticker" aria-label="สติกเกอร์"></div>
  <button class="big" id="nextLevel" aria-label="ไปด่านต่อไป"><svg class="ico" viewBox="0 0 24 24"><path fill="#fff" d="M7 4l13 8-13 8z"/></svg></button>
</section>

<section class="scr" id="s-mic" aria-label="ไมค์ใช้ไม่ได้">

  <div id="micHelp"></div>
  <button class="big" id="micRetry" aria-label="ลองใหม่"><svg class="ico" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M19 12a7 7 0 11-2.1-5M19 4v4h-4"/></svg></button>
</section>
